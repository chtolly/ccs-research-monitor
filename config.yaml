# Conference, course and event lists. Unlike news pages, every event link not seen before is
# passed to Claude (also the first time), because an upcoming event matters however long it has
# been listed. Claude opens each one and keeps only relevant events whose date or deadline is ahead.
# other_hosts: true = the list links to event pages on another website.
event_pages:
  - {name: "IEAGHG – events (GHGT, summer school, workshops)", url: "https://ieaghg.org/events/", link_contains: "/events/"}
  - {name: "Carbon Management Europe / ZEP – events", url: "https://carbonmanagementeurope.org/events/", link_contains: "/event/"}
  - {name: "gigaCCS – events", url: "https://gigaccs.no/events/", link_contains: "/event/"}
  - {name: "NCCS – events", url: "https://nccs.no/events/", link_contains: "/event/"}
  - {name: "SINTEF – events and courses", url: "https://www.sintef.no/en/events/", link_contains: "/en/events/"}

# Pages Claude opens itself each week (they block GitHub's servers or are built by
# JavaScript, so the free collector cannot read them). Claude looks for items dated on
# or after the "since" date.
claude_checks:
  - {name: "IEA – reports", url: "https://www.iea.org/analysis?type=report"}
  - {name: "IEA – CCUS", url: "https://www.iea.org/energy-system/carbon-capture-utilisation-and-storage"}
  - {name: "Norwegian Offshore Directorate (Sodir) – news", url: "https://www.sodir.no/en/whats-new/news/"}
  - {name: "Swedish Energy Agency – news", url: "https://www.energimyndigheten.se/en/news/"}
  - {name: "Carbon Herald", url: "https://carbonherald.com/"}


# Step 1 — free collector. Runs every Monday at 05:30 Oslo time (GitHub handles summer/winter time
# through the timezone setting). GitHub often starts scheduled runs late (sometimes hours), so when
# this finishes it starts the Claude routine itself through the routine's API trigger. The routine's
# own schedule (Monday 06:00 and 09:00 Oslo in winter, 07:00 and 10:00 in summer) is a backup.
# Repository secrets (Settings → Secrets → Actions): ROUTINE_FIRE_URL, ROUTINE_FIRE_TOKEN (routine trigger),
# REVIEW_INGEST_KEY (review space; used to skip items already waiting for review).
name: 1 · Collect candidates

on:
  schedule:
    - cron: "30 5 * * 1"
      timezone: "Europe/Oslo"
  workflow_dispatch:
    inputs:
      redo:
        description: "Also redo this week's run even if it is already done"
        type: boolean
        default: false
      start_routine:
        description: "Start the Claude routine when the list is ready (the routine itself turns this off when it starts the collector)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Note which list this run starts from
        run: echo "START_GEN=$(python3 -c "import json;print(json.load(open('data/candidates.json')).get('generated_at',''))")" >> "$GITHUB_ENV"
      - name: Collect feeds, pages and new papers
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          REVIEW_INGEST_KEY: ${{ secrets.REVIEW_INGEST_KEY }}
        run: python scripts/collect.py ${{ inputs.redo && '--force' || '' }}
      - name: Save candidates to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/seen_links.json data/source_health.json
          git diff --cached --quiet && exit 0
          TODAY=$(TZ=Europe/Oslo date +%F)
          # If the Claude routine pushed a new list while this run was collecting, keep that one
          git fetch -q origin main
          MAIN=$(git show origin/main:data/candidates.json | python3 -c "import json,sys;print(json.load(sys.stdin).get('generated_at',''))")
          if [ "$MAIN" != "$START_GEN" ] && [ "${{ inputs.redo }}" != "true" ]; then echo "A newer list was pushed meanwhile; keeping it."; exit 0; fi
          git commit -m "Candidates $TODAY"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          echo "PUSHED=1" >> "$GITHUB_ENV"
      - name: Start the Claude routine now that today's list is ready
        if: (env.PUSHED == '1' || inputs.redo) && (github.event_name != 'workflow_dispatch' || inputs.start_routine) && (env.TOPUP != '1' || env.TOPUP_NEW != '')
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          if [ -z "$ROUTINE_FIRE_URL" ] || [ -z "$ROUTINE_FIRE_TOKEN" ]; then
            echo "::warning::Routine API trigger not set up (secrets missing); the routine's own schedule will run it instead."
            exit 0
          fi
          TODAY=$(TZ=Europe/Oslo date +%F)
          MSG="Started by the collector: data/candidates.json for $TODAY (this week's run) is ready."
          [ "${{ inputs.redo }}" = "true" ] && MSG="$MSG Please redo this week's run even if it is already done."
          [ -n "${TOPUP_NEW:-}" ] && MSG="Started by the collector: TOP-UP. $TOPUP_NEW new candidates from sites that blocked the morning collection were added to data/candidates.json for $TODAY. Please redo this week's draft as a top-up."
          for i in 1 2 3; do
            CODE=$(curl -s -o resp.json -w "%{http_code}" -X POST "$ROUTINE_FIRE_URL" \
              -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
              -H "anthropic-version: 2026-10-21" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"$MSG\"}")
            echo "Routine fire: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            case "$CODE" in 5*|429) sleep 60 ;; *) break ;; esac
          done
          cat resp.json; echo "::error::Could not start the Claude routine (HTTP $CODE). Its own schedule will still run as a backup."
          exit 1

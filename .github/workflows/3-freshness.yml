# Safety net. At 11:00 UTC (12:00 Oslo winter / 13:00 summer), after both routine runs, and again
# at 14:15 UTC, this checks that today's digest was published AND was built from today's list,
# and that no source has failed 3 days in a row. If not, the run fails and GitHub emails you.
name: 3 · Check today's update

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "15 14 * * *"   # second try: GitHub sometimes skips scheduled runs entirely
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Was today's digest published?
        run: |
          # GitHub sometimes starts this check many hours late. Before noon (Oslo), today's runs may not be
          # finished yet, so a check that starts then (e.g. a late one after midnight) looks at yesterday.
          if [ "$(TZ=Europe/Oslo date +%H)" -lt 12 ]; then TODAY=$(TZ=Europe/Oslo date -d yesterday +%F); else TODAY=$(TZ=Europe/Oslo date +%F); fi
          LAST=$(python3 -c "import json;print(json.load(open('data/state.json')).get('last_digest_date',''))" 2>/dev/null || echo "")
          CAND=$(python3 -c "import json;print(json.load(open('data/candidates.json')).get('digest_date',''))" 2>/dev/null || echo "")
          echo "Today (Oslo): $TODAY | last published digest: ${LAST:-none} | last collector run: ${CAND:-none}"
          if [ "$LAST" != "$TODAY" ]; then
            echo "::error::Today's digest was NOT published. Website still shows ${LAST:-nothing}."
            [ "$CAND" != "$TODAY" ] && echo "::error::The collector (workflow 1) did not run today either — check the Actions tab."
            echo "::error::Otherwise check the Claude routine at https://claude.ai/code/routines (usage limit? GitHub access?)."
            exit 1
          fi
          USED=$(python3 -c "import json;print(json.load(open('data/digests/$TODAY.json')).get('candidates_date',''))" 2>/dev/null || echo "")
          if [ "$USED" != "$TODAY" ]; then
            echo "::error::Today's digest was published, but from an OLD collector list (${USED:-unknown}), so items from news feeds and journals are missing."
            echo "::error::The collector (workflow 1) ran late or failed — check the Actions tab. When it finishes it restarts Claude and the page refreshes by itself."
            exit 1
          fi
          BROKEN=$(python3 -c "
          import json
          h = json.load(open('data/source_health.json'))
          print('; '.join(f'{n} (failing {v[\"fails\"]} days, last OK {v.get(\"last_ok\") or \"never\"})' for n, v in h.items() if v.get('fails', 0) >= 3))
          " 2>/dev/null || echo "")
          if [ -n "$BROKEN" ]; then
            echo "::error::Today's digest is live, but these news sources have failed for 3+ days in a row: $BROKEN"
            echo "::error::Their news is not being collected. Fix or replace their address in config.yaml (feeds / watch_pages)."
            exit 1
          fi
          echo "OK — today's digest is live and built from today's list, and all sources are working."
